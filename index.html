<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderPlan | Smart Travel Planner</title>
  <link rel="stylesheet" href="style.css?v=5.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo"><i class="fas fa-plane-departure"></i> WanderPlan</a>
  </header>

  <div class="container" style="max-width: 800px;">
    
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Where to next?</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem;">Enter your trip details below and we will automatically generate a day-by-day itinerary and realistic budget.</p>
    </div>

    <div class="card">
      <form id="trip-form">
        <div class="form-grid">
          <div class="input-group">
            <label>Origin (e.g., New York, NY)</label>
            <input type="text" id="input-origin" required placeholder="Where are you leaving from?">
          </div>
          <div class="input-group">
            <label>Destination (e.g., Swiss Alps)</label>
            <input type="text" id="input-dest" required placeholder="Where do you want to go?">
          </div>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label>Duration (Days)</label>
            <input type="number" id="input-days" required min="1" max="30" value="7">
          </div>
          <div class="input-group">
            <label>Number of Travelers</label>
            <input type="number" id="input-travelers" required min="1" max="10" value="1">
          </div>
        </div>

        <div class="input-group">
          <label>Travel Style</label>
          <select id="input-style" required>
            <option value="budget">Backpacker / Budget</option>
            <option value="standard" selected>Standard Comfort</option>
            <option value="luxury">Luxury / Premium</option>
          </select>
        </div>

        <div class="input-group" style="margin-top: 30px;">
          <button type="submit" class="btn"><i class="fas fa-magic"></i> Generate Travel Plan</button>
        </div>
      </form>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
