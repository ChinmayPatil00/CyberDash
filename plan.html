<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Breakdown | Venture</title>
  <link rel="stylesheet" href="style.css?v=9.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">Venture.</a>
    <div class="nav-links">
      <a href="index.html" style="color: var(--primary);">Bail</a>
    </div>
  </nav>

  <div class="container" style="max-width: 900px; margin-top: 40px;">
    
    <h1 style="font-size: 2.5rem; text-transform: uppercase; margin-bottom: 5px;">The Breakdown</h1>
    <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 30px;">
      <span id="display-origin">Origin</span> <i class="fas fa-arrow-right" style="color:var(--primary); margin:0 10px;"></i> <span id="display-dest" style="color:var(--text-main); font-weight:700;">Destination</span>
    </p>

    <!-- Multi-page Navigation -->
    <div class="dash-nav">
      <a href="plan.html" class="active">The Breakdown</a>
      <a href="itinerary.html">The Moves</a>
      <a href="gear.html">The Fit & Gear</a>
    </div>

    <!-- Overview Stats -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;">
      <div class="dash-card" style="margin-bottom: 0; padding: 20px; text-align: center;">
        <div style="color: var(--primary); font-size: 2rem; font-weight: 900;" id="display-days">0</div>
        <div style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Days</div>
      </div>
      <div class="dash-card" style="margin-bottom: 0; padding: 20px; text-align: center;">
        <div style="color: var(--primary); font-size: 2rem; font-weight: 900;" id="display-travelers">0</div>
        <div style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Squad Size</div>
      </div>
      <div class="dash-card" style="margin-bottom: 0; padding: 20px; text-align: center;">
        <div style="color: var(--primary); font-size: 1.2rem; font-weight: 900; line-height: 2rem;" id="display-purpose">Vibe</div>
        <div style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Expedition Type</div>
      </div>
    </div>

    <!-- Budget Overview -->
    <div class="dash-card">
      <div class="dash-header"><i class="fas fa-wallet"></i> Expedition Costs</div>
      <ul class="budget-list" id="budget-list">
        <!-- Populated by JS -->
      </ul>
      <div class="budget-total">
        Total: <span id="budget-total">$0</span>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
