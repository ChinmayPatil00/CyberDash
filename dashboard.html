<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDash | Telemetry</title>
  <link rel="stylesheet" href="style.css?v=2.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="scanlines"></div>
  <div id="rec-indicator" class="rec-indicator">
    <div class="dot"></div> REC
  </div>

  <div class="layout">
    <!-- Left Hardware Panel -->
    <aside class="sidebar hw-panel" style="padding: 20px;">
      <h2 class="text-glow" style="text-align: center; margin-bottom: 30px;">CYBERDASH</h2>
      
      <a href="dashboard.html" class="hw-button active" style="margin-bottom: 10px; text-align: center;"><i class="fas fa-satellite-dish"></i> TELEMETRY</a>
      <a href="settings.html" class="hw-button" style="margin-bottom: 10px; text-align: center;"><i class="fas fa-terminal"></i> COMMS LOG</a>
      
      <div style="margin-top: auto;">
        <h4 style="margin-bottom: 15px; color: var(--text-muted);">SYSTEM VITALS</h4>
        <!-- Oxygen Bar -->
        <div style="margin-bottom: 15px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>O2 RESERVES</span> <span class="text-glow">84%</span></div>
          <div style="width: 100%; height: 10px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);">
            <div style="width: 84%; height: 100%; background: var(--hud-color); box-shadow: 0 0 10px var(--hud-glow);"></div>
          </div>
        </div>
        <!-- Power Bar -->
        <div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>CORE POWER</span> <span class="text-glow">62%</span></div>
          <div style="width: 100%; height: 10px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);">
            <div style="width: 62%; height: 100%; background: var(--hud-color); box-shadow: 0 0 10px var(--hud-glow);"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main View -->
    <main class="main-view">
      <!-- Top HUD -->
      <header class="sci-panel" style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="color: var(--text-muted);">FOCUS:</span> <span class="text-glow" id="focus-mode-text">DEEP WORK</span>
        </div>
        <div class="text-glow">
          [ UPLINK STABLE ]
        </div>
        <div>
          <span style="color: var(--text-muted);">STATUS:</span> <span class="text-glow">ONLINE</span>
        </div>
      </header>

      <div class="dashboard-row">
        <!-- Pomodoro Timer Section -->
        <div class="hw-panel" style="padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
          <h3 style="margin-bottom: 10px; color: var(--text-muted);">ORBITAL FOCUS TIMER</h3>
          <h4 style="margin-bottom: 20px; color: var(--hud-color); font-size: 0.9rem;" id="timer-status">STANDBY</h4>
          
          <div style="position:relative; width:200px; height:200px; margin: 0 auto; display:flex; justify-content:center; align-items:center;">
            <svg width="200" height="200" viewBox="0 0 200 200" style="transform: rotate(-90deg); position:absolute; top:0; left:0;">
              <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,240,255,0.1)" stroke-width="10" />
              <circle id="timer-ring" cx="100" cy="100" r="90" fill="none" stroke="var(--hud-color)" stroke-width="10" stroke-dasharray="565.48" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 10px var(--hud-glow));" />
            </svg>
            <div id="timer-text" class="text-glow" style="font-size:2.5rem; font-weight:bold; letter-spacing:2px; font-family:'Share Tech Mono', monospace;">25:00</div>
          </div>
          
          <div style="margin-top: 25px; display:flex; gap:10px;">
            <button id="btn-timer-start" class="hw-button"><i class="fas fa-play"></i> START</button>
            <button id="btn-timer-reset" class="hw-button" style="border-color:var(--hud-alert); color:var(--hud-alert);"><i class="fas fa-stop"></i> RESET</button>
          </div>
        </div>
        
        <!-- Controls Section -->
        <div class="hw-panel" style="padding: 30px; flex: 1; display: flex; flex-direction: column; justify-content: space-around;">
          <h3 style="color: var(--text-muted); text-align: center;">FOCUS OVERRIDES</h3>
          
          <div class="override-grid">
            <button id="btn-floodlights" class="hw-button toggle-btn"><i class="fas fa-lightbulb"></i> <span>FLOODLIGHTS</span></button>
            <button id="btn-whitenoise" class="hw-button toggle-btn"><i class="fas fa-headphones"></i> <span>WHITE NOISE</span></button>
            <button id="btn-doors" class="hw-button toggle-btn"><i class="fas fa-lock"></i> <span>LOCK DOORS</span></button>
            <button id="btn-shields" class="hw-button toggle-btn"><i class="fas fa-shield-alt"></i> <span>SHIELDS</span></button>
          </div>
        </div>
      </div>
      
      <!-- Kanban Board (Mission Objectives) -->
      <div class="hw-panel" style="margin-top: 20px; padding: 20px; display: flex; flex-direction: column; min-height: 300px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="color: var(--hud-color); letter-spacing: 2px;">MISSION OBJECTIVES</h3>
          <div style="display:flex; gap:10px;">
            <input type="text" id="task-input" placeholder="Enter objective..." style="background:rgba(0,0,0,0.5); border:1px solid var(--hud-color); color:var(--hud-color); padding:5px 10px; font-family:'Share Tech Mono'; outline:none;">
            <button id="btn-add-task" class="hw-button" style="padding:5px 15px;"><i class="fas fa-plus"></i></button>
          </div>
        </div>
        
        <div style="display: flex; gap: 20px; flex: 1;">
          <!-- Column 1: Pending -->
          <div class="kanban-col" data-status="pending" style="flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); padding:10px; display:flex; flex-direction:column; gap:10px;">
            <h4 style="text-align:center; color:var(--text-muted); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px;">PENDING</h4>
            <div class="kanban-dropzone" style="flex:1; min-height:50px;"></div>
          </div>
          
          <!-- Column 2: Active -->
          <div class="kanban-col" data-status="active" style="flex:1; background:rgba(0,0,0,0.3); border:1px solid var(--hud-color); box-shadow:0 0 10px rgba(0,240,255,0.1) inset; padding:10px; display:flex; flex-direction:column; gap:10px;">
            <h4 style="text-align:center; color:var(--hud-color); border-bottom:1px solid var(--hud-color); padding-bottom:5px;">ACTIVE</h4>
            <div class="kanban-dropzone" style="flex:1; min-height:50px;"></div>
          </div>
          
          <!-- Column 3: Completed -->
          <div class="kanban-col" data-status="completed" style="flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(0,255,0,0.3); padding:10px; display:flex; flex-direction:column; gap:10px;">
            <h4 style="text-align:center; color:#00ff00; border-bottom:1px solid rgba(0,255,0,0.3); padding-bottom:5px;">COMPLETED</h4>
            <div class="kanban-dropzone" style="flex:1; min-height:50px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <script src="app.js"></script>
</body>
</html>
