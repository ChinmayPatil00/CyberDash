<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderPlan | Your Itinerary</title>
  <link rel="stylesheet" href="style.css?v=5.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-globe-americas"></i> WanderPlan</a>
    <div class="nav-links">
      <a href="index.html" style="color: var(--text-muted); font-weight: 500;"><i class="fas fa-search"></i> New Search</a>
    </div>
  </nav>

  <!-- Dynamic Hero Banner -->
  <div class="hero-banner" id="hero-banner" style="background-color: #ddd; background-size: cover; background-position: center; height: 350px; position: relative; display: flex; align-items: flex-end; padding-bottom: 40px;">
    <div style="position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);"></div>
    <div class="container" style="position: relative; z-index: 10; margin: 0 auto; width: 100%;">
      <h1 style="font-size: 3.5rem; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Trip to <span id="display-dest">Destination</span></h1>
      <p style="color: #e2e8f0; font-size: 1.1rem; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-top:10px;">
        <i class="fas fa-calendar-alt"></i> <span id="display-days">X</span> Days &nbsp;|&nbsp; 
        <i class="fas fa-users"></i> <span id="display-travelers">X</span> Traveler(s) &nbsp;|&nbsp; 
        <i class="fas fa-suitcase"></i> <span id="display-style" style="text-transform: capitalize;">Style</span> &nbsp;|&nbsp; 
        <i class="fas fa-coins"></i> <span id="display-currency">CUR</span>
      </p>
      <p style="color: #e2e8f0; font-size: 1.1rem; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-top:5px;">
        <i class="fas fa-route"></i> Medium: <span id="display-medium" style="text-transform: capitalize; font-weight:600;">Air</span> &nbsp;|&nbsp; 
        <i class="fas fa-map-signs"></i> Purpose: <span id="display-purpose" style="text-transform: capitalize; font-weight:600;">Leisure</span>
      </p>
    </div>
  </div>

  <div class="container" style="margin-top: 40px;">

    <div class="dashboard-grid">
      
      <!-- Left: Itinerary Timeline -->
      <div class="card">
        <div class="card-title"><i class="fas fa-map-marked-alt"></i> Day-by-Day Itinerary</div>
        <div class="timeline" id="itinerary-timeline">
          <!-- Populated by app.js -->
        </div>
      </div>

      <!-- Right: Budget Breakdown -->
      <div class="card">
        <div class="card-title"><i class="fas fa-wallet"></i> Estimated Budget</div>
        
        <ul class="budget-list" id="budget-list">
          <!-- Populated by app.js -->
        </ul>

        <div class="budget-total" id="budget-total">
          $0
        </div>
        <p style="text-align: right; color: var(--text-muted); font-size: 0.8rem; margin-top: 5px;">Total Estimated Cost (USD)</p>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
