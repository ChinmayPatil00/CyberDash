<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegant Music Player</title>
  <link rel="stylesheet" href="2style.css">
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="player-container">
    <div class="player-main">
      <!-- Player Top: Cover and Info -->
      <div class="player-top">
        <div class="cover-wrapper">
          <img id="cover" src="songs/song4.jpg" alt="Album Cover">
        </div>
        <div class="song-info">
          <h3 id="title">Saiyaara</h3>
          <p id="artist">Arijit Singh</p>
        </div>
      </div>

      <!-- Progress Area -->
      <div class="progress-area">
        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="progress"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="shuffle" class="control-btn small-btn" title="Shuffle"><i class="fas fa-random"></i></button>
        <button id="prev" class="control-btn" title="Previous"><i class="fas fa-step-backward"></i></button>
        <button id="play" class="control-btn play-btn" title="Play/Pause"><i class="fas fa-play"></i></button>
        <button id="next" class="control-btn" title="Next"><i class="fas fa-step-forward"></i></button>
        <button id="repeat" class="control-btn small-btn" title="Repeat"><i class="fas fa-redo"></i></button>
      </div>

      <!-- Volume -->
      <div class="volume-area">
        <button id="mute" class="volume-btn"><i class="fas fa-volume-up"></i></button>
        <input type="range" id="volume-slider" min="0" max="100" value="100">
      </div>

      <audio id="audio"></audio>
    </div>

    <!-- Playlist Section -->
    <div class="playlist-section">
      <div class="playlist-header">
        <h3>Playlist</h3>
      </div>
      <ul id="playlist" class="playlist-list">
        <!-- Playlist items will be generated by JS -->
      </ul>
    </div>
  </div>

  <script src="3file.js"></script>
</body>
</html>
