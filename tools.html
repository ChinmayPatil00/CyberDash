<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDash | Generators</title>
  <link rel="stylesheet" href="style.css?v=4.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-terminal" style="color: var(--primary);"></i> DevDash
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-link">
        <i class="fas fa-code"></i> Data Formatters
      </a>
      <a href="tools.html" class="nav-link active">
        <i class="fas fa-shield-alt"></i> Generators & Crypto
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="topbar">
      Generators & Cryptography
    </div>
    
    <div class="content-wrapper">
      
      <!-- Hash Generator Tool -->
      <div class="card">
        <div class="card-title">Cryptographic Hash Generator</div>
        <div class="input-group">
          <label class="label">Input String</label>
          <input type="text" id="hash-input" placeholder="Enter text to hash..." autocomplete="off">
        </div>
        
        <div class="split-view">
          <div>
            <label class="label">SHA-256 Hash</label>
            <div id="hash-256-output" class="output-panel" style="min-height: 60px; word-break: break-all;"></div>
          </div>
          <div>
            <label class="label">SHA-384 Hash</label>
            <div id="hash-384-output" class="output-panel" style="min-height: 60px; word-break: break-all;"></div>
          </div>
        </div>
      </div>

      <!-- Base64 Tool -->
      <div class="card">
        <div class="card-title">Base64 Encoder / Decoder</div>
        <div class="split-view">
          <div>
            <label class="label">Plain Text (to encode)</label>
            <textarea id="b64-plain" placeholder="Enter plain text..."></textarea>
          </div>
          <div>
            <label class="label">Base64 String (to decode)</label>
            <textarea id="b64-encoded" placeholder="Enter base64 string..."></textarea>
          </div>
        </div>
      </div>

      <!-- UUID Generator -->
      <div class="card">
        <div class="card-title">UUIDv4 Generator</div>
        <div style="display:flex; gap:15px; align-items:center;">
          <button id="btn-uuid" class="btn"><i class="fas fa-sync-alt"></i> Generate New UUID</button>
          <div id="uuid-output" class="output-panel" style="flex:1; min-height: 40px; padding: 10px 16px; font-size: 1rem;"></div>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
