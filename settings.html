<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora | Settings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <nav class="sidebar neu-panel" style="border-radius: 0; box-shadow: 5px 0 15px var(--neu-shadow-dark);">
      <h2>AURORA</h2>
      <a href="dashboard.html" class="neu-button"><i class="fas fa-home"></i> Dashboard</a>
      <a href="#" class="neu-button"><i class="fas fa-music"></i> Library</a>
      <a href="settings.html" class="neu-button active"><i class="fas fa-cog"></i> Settings</a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <h1 style="margin-bottom: 30px;">Settings</h1>
      
      <div class="glass-panel" style="padding: 40px; max-width: 600px;">
        <h3 style="margin-bottom: 20px; color: var(--accent);">Preferences</h3>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
          <div>
            <h4>Dark Mode</h4>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Toggle between light and dark theme.</p>
          </div>
          <!-- Neumorphic Toggle -->
          <div class="neu-panel" style="width: 60px; height: 30px; border-radius: 15px; position: relative; cursor: pointer; box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);">
            <div style="position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow);"></div>
          </div>
        </div>

        <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
          <h4 style="margin-bottom: 10px;">Audio Quality</h4>
          <!-- Neumorphic Buttons as Radio Options -->
          <div style="display: flex; gap: 10px;">
            <button class="neu-button">Standard</button>
            <button class="neu-button active" style="color: var(--accent);">High (320kbps)</button>
            <button class="neu-button">Lossless</button>
          </div>
        </div>
        
        <div>
          <h4 style="margin-bottom: 15px;">Volume Limit</h4>
          <!-- Neumorphic Slider Track -->
          <div style="width: 100%; height: 12px; background: var(--neu-bg); border-radius: 6px; box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light); position: relative;">
            <!-- Filled part -->
            <div style="width: 75%; height: 100%; background: rgba(0, 240, 255, 0.3); border-radius: 6px;"></div>
            <!-- Neumorphic Thumb -->
            <div class="neu-panel" style="width: 24px; height: 24px; border-radius: 50%; position: absolute; top: -6px; left: 75%; transform: translateX(-50%); border: 2px solid var(--accent);"></div>
          </div>
        </div>
      </div>
      
    </main>
  </div>
</body>
</html>
