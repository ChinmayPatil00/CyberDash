<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDash | Telemetry</title>
  <link rel="stylesheet" href="style.css?v=2.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="scanlines"></div>
  <div id="rec-indicator" class="rec-indicator">
    <div class="dot"></div> REC
  </div>

  <div class="layout">
    <!-- Left Hardware Panel -->
    <aside class="sidebar hw-panel" style="padding: 20px;">
      <h2 class="text-glow" style="text-align: center; margin-bottom: 30px;">CYBERDASH</h2>
      
      <a href="dashboard.html" class="hw-button active" style="margin-bottom: 10px; text-align: center;"><i class="fas fa-satellite-dish"></i> TELEMETRY</a>
      <a href="settings.html" class="hw-button" style="margin-bottom: 10px; text-align: center;"><i class="fas fa-terminal"></i> COMMS LOG</a>
      
      <div style="margin-top: auto;">
        <h4 style="margin-bottom: 15px; color: var(--text-muted);">SYSTEM VITALS</h4>
        <!-- Oxygen Bar -->
        <div style="margin-bottom: 15px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>O2 RESERVES</span> <span class="text-glow">84%</span></div>
          <div style="width: 100%; height: 10px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);">
            <div style="width: 84%; height: 100%; background: var(--hud-color); box-shadow: 0 0 10px var(--hud-glow);"></div>
          </div>
        </div>
        <!-- Power Bar -->
        <div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>CORE POWER</span> <span class="text-glow">62%</span></div>
          <div style="width: 100%; height: 10px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);">
            <div style="width: 62%; height: 100%; background: var(--hud-color); box-shadow: 0 0 10px var(--hud-glow);"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main View -->
    <main class="main-view">
      <!-- Top HUD -->
      <header class="sci-panel" style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="color: var(--text-muted);">ORBIT:</span> <span class="text-glow" id="iss-loc">AWAITING TELEMETRY</span>
        </div>
        <div class="text-glow">
          [ UPLINK STABLE ]
        </div>
        <div>
          <span style="color: var(--text-muted);">POS:</span> <span class="text-glow" id="iss-latlon">LAT: -- LON: --</span>
        </div>
      </header>

      <div class="dashboard-row">
        <!-- Radar Section -->
        <div class="hw-panel" style="padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
          <h3 style="margin-bottom: 10px; color: var(--text-muted);">ORBITAL SCANNER (ISS)</h3>
          <h4 style="margin-bottom: 20px; color: var(--hud-color); font-size: 0.9rem;" id="iss-status">ACQUIRING TARGET...</h4>
          <div class="radar-container" id="radar-container">
            <canvas id="visualizer-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.3s;"></canvas>
            <div class="radar-sweep"></div>
            <div id="iss-blip" style="position: absolute; width: 10px; height: 10px; background: #00f0ff; border-radius: 50%; box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff; display: none; z-index: 10; transition: all 1s linear;"></div>
          </div>
        </div>
        
        <!-- Controls Section -->
        <div class="hw-panel" style="padding: 30px; flex: 1; display: flex; flex-direction: column; justify-content: space-around;">
          <h3 style="color: var(--text-muted); text-align: center;">MANUAL OVERRIDES</h3>
          
          <div class="override-grid">
            <button id="btn-floodlights" class="hw-button toggle-btn"><i class="fas fa-lightbulb"></i> <span>FLOODLIGHTS</span></button>
            <button id="btn-visualizer" class="hw-button toggle-btn"><i class="fas fa-wave-square"></i> <span>VISUALIZER</span></button>
            <button id="btn-cam" class="hw-button toggle-btn"><i class="fas fa-camera"></i> <span>CAM REC</span></button>
            <button id="btn-doors" class="hw-button toggle-btn"><i class="fas fa-lock"></i> <span>LOCK DOORS</span></button>
          </div>
          
          <!-- Webcam Security Feed -->
          <div class="sci-panel" style="padding: 10px; text-align: center; background: rgba(0,0,0,0.8); margin-top: 20px; position: relative; overflow: hidden; height: 150px; border-color: rgba(0,255,0,0.3);">
            <div style="position: absolute; top: 10px; left: 10px; z-index: 5; color: #00ff00; font-size: 0.8rem; text-shadow: 0 0 5px #00ff00;">CAM 01 // NIGHT VISION</div>
            <video id="webcam-video" autoplay playsinline style="display: none;"></video>
            <canvas id="webcam-canvas" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.8; filter: contrast(1.5) brightness(1.2);"></canvas>
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.1) 3px, rgba(0,255,0,0.1) 4px); pointer-events: none; z-index: 2;"></div>
          </div>
        </div>
      </div>
      
      <!-- Breach Protocol (Neural Network) -->
      <div class="hw-panel" style="margin-top: 20px; padding: 20px; position: relative; height: 250px; overflow: hidden; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; z-index: 2; pointer-events: none;">
          <h3 style="color: var(--hud-alert); text-shadow: 0 0 10px var(--hud-alert); letter-spacing: 2px;">BREACH PROTOCOL // NEURAL UPLINK</h3>
          <span class="text-glow" id="node-status">NODES CONNECTED: 0</span>
        </div>
        <canvas id="neural-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: crosshair;"></canvas>
      </div>
    </main>
  </div>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <script src="app.js"></script>
</body>
</html>
