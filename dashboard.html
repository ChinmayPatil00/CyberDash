<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARES | Rover Control</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="scanlines"></div>

  <div class="layout">
    <!-- Left Hardware Panel -->
    <aside class="sidebar hw-panel" style="padding: 20px;">
      <h2 class="text-glow" style="text-align: center; margin-bottom: 30px;">ARES SYS.</h2>
      
      <a href="dashboard.html" class="hw-button active" style="margin-bottom: 10px; text-align: center;"><i class="fas fa-satellite-dish"></i> TELEMETRY</a>
      <a href="settings.html" class="hw-button" style="margin-bottom: 10px; text-align: center;"><i class="fas fa-terminal"></i> COMMS LOG</a>
      
      <div style="margin-top: auto;">
        <h4 style="margin-bottom: 15px; color: var(--text-muted);">SYSTEM VITALS</h4>
        <!-- Oxygen Bar -->
        <div style="margin-bottom: 15px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>O2 RESERVES</span> <span class="text-glow">84%</span></div>
          <div style="width: 100%; height: 10px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);">
            <div style="width: 84%; height: 100%; background: var(--hud-color); box-shadow: 0 0 10px var(--hud-glow);"></div>
          </div>
        </div>
        <!-- Power Bar -->
        <div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>CORE POWER</span> <span class="text-glow">62%</span></div>
          <div style="width: 100%; height: 10px; background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);">
            <div style="width: 62%; height: 100%; background: var(--hud-color); box-shadow: 0 0 10px var(--hud-glow);"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main View -->
    <main class="main-view">
      <!-- Top HUD -->
      <header class="sci-panel" style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="color: var(--text-muted);">LOC:</span> <span class="text-glow">SECTOR 7G</span>
        </div>
        <div class="text-glow">
          [ UPLINK STABLE ]
        </div>
        <div>
          <span style="color: var(--text-muted);">TEMP:</span> <span class="text-glow">-60&deg;C</span>
        </div>
      </header>

      <div style="display: flex; gap: 20px; flex: 1;">
        <!-- Radar Section -->
        <div class="hw-panel" style="padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
          <h3 style="margin-bottom: 30px; color: var(--text-muted);">SURFACE SCANNER</h3>
          <div class="radar-container">
            <div class="radar-sweep"></div>
            <!-- Target dot -->
            <div style="position: absolute; top: 30%; right: 30%; width: 6px; height: 6px; background: var(--hud-color); border-radius: 50%; box-shadow: 0 0 10px var(--hud-color); animation: blink 2s infinite;"></div>
          </div>
        </div>
        
        <!-- Controls Section -->
        <div class="hw-panel" style="padding: 30px; flex: 1; display: flex; flex-direction: column; justify-content: space-around;">
          <h3 style="color: var(--text-muted); text-align: center;">MANUAL OVERRIDES</h3>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <button class="hw-button"><i class="fas fa-lightbulb"></i> FLOODLIGHTS</button>
            <button class="hw-button"><i class="fas fa-shield-alt"></i> SHIELDS</button>
            <button class="hw-button"><i class="fas fa-camera"></i> CAM REC</button>
            <button class="hw-button"><i class="fas fa-lock"></i> LOCK DOORS</button>
          </div>
          
          <div class="sci-panel" style="padding: 15px; text-align: center; background: rgba(0,0,0,0.5);">
            <span style="color: var(--text-muted);">DRIVE MODE:</span> <span class="text-glow">AUTONOMOUS</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <script src="app.js"></script>
</body>
</html>
