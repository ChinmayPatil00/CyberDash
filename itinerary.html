<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detailed Itinerary | WanderPlan</title>
  <link rel="stylesheet" href="style.css?v=6.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fas fa-globe-americas"></i> WanderPlan</a>
    <div class="nav-links">
      <a href="plan.html" style="color: var(--primary); font-weight: 500;"><i class="fas fa-arrow-left"></i> Back to Package</a>
    </div>
  </nav>

  <div class="container" style="margin-top: 100px; max-width: 800px;">
    
    <div style="margin-bottom: 40px; text-align: center;">
      <h1 style="font-size: 2.5rem;">Detailed Itinerary</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem;">From <span id="display-origin" style="font-weight:600; color:var(--text-main);">Origin</span> to <span id="display-dest-itin" style="font-weight:600; color:var(--primary);">Destination</span></p>
    </div>

    <div class="card">
      <h2 class="card-title"><i class="fas fa-route" style="color: var(--primary);"></i> Day-by-Day Plan</h2>
      <div class="timeline" id="itinerary-timeline">
        <!-- Javascript will populate this -->
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
