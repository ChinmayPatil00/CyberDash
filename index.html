<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venture - Gen-Z Expeditions</title>
  <link rel="stylesheet" href="style.css?v=9.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">Venture.</a>
    <div class="nav-links">
      <a href="#">Expeditions</a>
      <a href="#">Gear</a>
      <a href="#">Log In</a>
    </div>
  </nav>

  <div class="container">
    
    <div class="hero">
      <h1>What's your next <span class="highlight">vibe?</span></h1>
      <p>Select your expedition type and build a custom mission loadout.</p>
    </div>

    <!-- 10 Option Grid -->
    <div class="vibe-grid" id="vibe-selector">
      <div class="vibe-card active" data-vibe="treks">
        <span class="vibe-icon">🏔️</span>
        <div class="vibe-title">Alpine Treks</div>
      </div>
      <div class="vibe-card" data-vibe="bike">
        <span class="vibe-icon">🏍️</span>
        <div class="vibe-title">Bike Rides</div>
      </div>
      <div class="vibe-card" data-vibe="monsoon">
        <span class="vibe-icon">🌧️</span>
        <div class="vibe-title">Monsoon Rides</div>
      </div>
      <div class="vibe-card" data-vibe="roadtrip">
        <span class="vibe-icon">🚗</span>
        <div class="vibe-title">Epic Roadtrips</div>
      </div>
      <div class="vibe-card" data-vibe="jungle">
        <span class="vibe-icon">🌴</span>
        <div class="vibe-title">Jungle Safari</div>
      </div>
      <div class="vibe-card" data-vibe="skydiving">
        <span class="vibe-icon">🪂</span>
        <div class="vibe-title">Skydiving</div>
      </div>
      <div class="vibe-card" data-vibe="kayaking">
        <span class="vibe-icon">🛶</span>
        <div class="vibe-title">Kayaking</div>
      </div>
      <div class="vibe-card" data-vibe="surf">
        <span class="vibe-icon">🏄</span>
        <div class="vibe-title">Surf & Beach</div>
      </div>
      <div class="vibe-card" data-vibe="camping">
        <span class="vibe-icon">⛺</span>
        <div class="vibe-title">Wild Camping</div>
      </div>
      <div class="vibe-card" data-vibe="climbing">
        <span class="vibe-icon">🧗</span>
        <div class="vibe-title">Rock Climbing</div>
      </div>
    </div>

    <!-- The Setup Form -->
    <div class="setup-box">
      <h2>Mission Details</h2>
      <form id="trip-form">
        
        <input type="hidden" id="input-purpose" value="treks">

        <div class="form-row">
          <div class="input-group">
            <label>Origin Basecamp</label>
            <div class="autocomplete-wrapper">
              <input type="text" id="input-origin" required placeholder="e.g. Seattle" autocomplete="off">
              <div id="autocomplete-list-origin" class="autocomplete-list"></div>
            </div>
          </div>
          <div class="input-group">
            <label>Target Dropzone</label>
            <div class="autocomplete-wrapper">
              <input type="text" id="input-dest" required placeholder="e.g. Mount Rainier" autocomplete="off">
              <div id="autocomplete-list-dest" class="autocomplete-list"></div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Launch Date</label>
            <input type="date" id="input-date" required>
          </div>
          <div class="input-group">
            <label>Duration (Days)</label>
            <input type="number" id="input-days" min="1" max="30" value="5" required>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Squad Size (People)</label>
            <input type="number" id="input-travelers" min="1" max="20" value="2" required>
          </div>
          <div class="input-group">
            <label>Currency</label>
            <select id="input-currency" required>
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
              <option value="INR">INR (₹)</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-generate">Generate Expedition Data</button>

      </form>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    // Handle Vibe Selection
    const vibeCards = document.querySelectorAll('.vibe-card');
    const purposeInput = document.getElementById('input-purpose');

    vibeCards.forEach(card => {
      card.addEventListener('click', () => {
        vibeCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        purposeInput.value = card.getAttribute('data-vibe');
      });
    });

    // Set default date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('input-date').valueAsDate = tomorrow;

    // --- Autocomplete Engine via Nominatim API ---
    function setupAutocomplete(inputId, listId) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);
      let timeout = null;

      input.addEventListener('input', () => {
        clearTimeout(timeout);
        const val = input.value;
        if (!val) {
          list.style.display = 'none';
          return;
        }

        timeout = setTimeout(() => {
          fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=5`)
            .then(res => res.json())
            .then(data => {
              list.innerHTML = '';
              if (data.length > 0) {
                list.style.display = 'block';
                data.forEach(item => {
                  const div = document.createElement('div');
                  div.className = 'autocomplete-item';
                  div.innerText = item.display_name;
                  div.addEventListener('click', () => {
                    // Just take the first part (city/location name)
                    input.value = item.display_name.split(',')[0]; 
                    list.style.display = 'none';
                  });
                  list.appendChild(div);
                });
              } else {
                list.style.display = 'none';
              }
            })
            .catch(() => { list.style.display = 'none'; });
        }, 300); // 300ms debounce
      });

      // Close list if clicked outside
      document.addEventListener('click', (e) => {
        if (e.target !== input && e.target !== list) {
          list.style.display = 'none';
        }
      });
    }

    setupAutocomplete('input-origin', 'autocomplete-list-origin');
    setupAutocomplete('input-dest', 'autocomplete-list-dest');
  </script>
</body>
</html>
