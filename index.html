<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control Authentication</title>
  <link rel="stylesheet" href="style.css?v=3.0">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
    }
    .auth-box {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: var(--text-main);
      letter-spacing: 2px;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .auth-input {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 12px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      text-align: center;
    }
    .auth-input:focus {
      border-color: var(--accent-color);
    }
    .auth-btn {
      width: 100%;
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .auth-btn:hover {
      background: var(--accent-hover);
    }
    .auth-footer {
      margin-top: 30px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-title">JPL MISSION CONTROL</div>
      <div class="auth-subtitle">Perseverance Surface Operations</div>
      
      <input type="password" class="auth-input" placeholder="ENTER OPERATOR ID" value="ADMIN-77X">
      
      <a href="dashboard.html" style="text-decoration: none;">
        <button class="auth-btn">Authenticate & Uplink</button>
      </a>

      <div class="auth-footer">
        UNAUTHORIZED ACCESS STRICTLY PROHIBITED<br>
        SECURE UPLINK: ENABLED
      </div>
    </div>
  </div>

</body>
</html>
